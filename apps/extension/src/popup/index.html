<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booksy Receipt Bridge</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>Booksy Receipt Bridge</h1>

      <p class="summary" data-state="checking" id="summary">Vérification du service…</p>

      <ul class="checklist" id="checklist"></ul>

      <section class="tab-pdf" id="tab-pdf">
        <h2>Onglet actif</h2>
        <p class="tab-name" id="tab-pdf-name">—</p>
        <button type="button" id="print-tab">🖨 Imprimer</button>
      </section>

      <div class="actions">
        <button type="button" id="retry">Revérifier</button>
        <button type="button" id="settings">Paramètres</button>
      </div>

      <section class="update" id="update">
        <h2>Mise à jour</h2>
        <p class="update-summary" id="update-summary">Non vérifiée.</p>
        <p class="note" id="update-detail"></p>
        <div class="actions">
          <button type="button" id="check-update">Vérifier</button>
          <button type="button" id="download-update" disabled>Télécharger</button>
        </div>
      </section>

      <p class="hint" id="hint"></p>
      <p class="feedback" id="feedback"></p>
      <p class="footer" id="footer"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
