<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booksy Receipt Bridge</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>Booksy Receipt Bridge</h1>

      <p class="summary" data-state="checking" id="summary">Vérification du service…</p>

      <ul class="checklist" id="checklist"></ul>

      <section class="tab-pdf" id="tab-pdf" hidden>
        <h2>Onglet actif</h2>
        <p class="tab-name" id="tab-pdf-name">—</p>
        <button type="button" id="print-tab">🖨 Imprimer ce ticket</button>
      </section>

      <section class="detected" id="detected" hidden>
        <h2>À imprimer</h2>
        <ul id="detected-list"></ul>
      </section>

      <section class="printer" id="printer" hidden>
        <h2>Imprimante</h2>
        <p id="printer-name">—</p>
      </section>

      <div class="actions">
        <button type="button" id="print-test" disabled>Imprimer un test</button>
        <button type="button" id="retry">Revérifier</button>
      </div>

      <div class="actions">
        <button type="button" id="settings">Paramètres</button>
      </div>

      <p class="hint" id="hint"></p>
      <p class="feedback" id="feedback"></p>
      <p class="footer" id="footer"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
