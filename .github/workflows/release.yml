name: Release

# Tagging is what publishes. The extension's update check reads the latest
# release from this repository, so a tag is the whole release procedure.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build the installer (${{ matrix.target }})
    # One archive per platform. Windows is where this runs in production; macOS
    # and Linux exist because the browser half is identical everywhere, and a
    # developer machine should install the real thing rather than a wrapper.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            exe: booksy-receipt-bridge.exe
          - os: macos-latest
            target: macos
            exe: booksy-receipt-bridge
          - os: ubuntu-latest
            target: linux
            exe: booksy-receipt-bridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Never publish something that does not pass its own gates.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build the native host
        # --win downloads the Windows runtime; elsewhere the runner's own Node
        # is injected, so the binary matches the machine that built it.
        run: pnpm build:host ${{ matrix.target == 'windows' && '--win' || '' }}

      - name: Build the extension
        run: pnpm build:extension

      # pwsh is on every runner, so the three platforms assemble their archive
      # with one script instead of three that drift apart.
      - name: Assemble the package
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "BooksyReceiptBridge-$version-${{ matrix.target }}"
          $stage = "installer/stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "installer/build/${{ matrix.exe }}" -Destination $stage
          Copy-Item installer/build/pdfjs -Destination $stage -Recurse
          Copy-Item installer/README.md -Destination $stage
          if ('${{ matrix.target }}' -eq 'windows') {
            Copy-Item installer/Install.ps1 -Destination $stage
            Copy-Item installer/Uninstall.ps1 -Destination $stage
          } else {
            Copy-Item installer/install.sh -Destination $stage
            Copy-Item installer/uninstall.sh -Destination $stage
          }
          # The unpacked extension travels with the host, so one artifact
          # updates both halves.
          Copy-Item apps/extension/dist -Destination "$stage/extension" -Recurse

          $asset = "installer/$name.zip"
          if ('${{ matrix.target }}' -eq 'windows') {
            Compress-Archive -Path $stage -DestinationPath $asset
          } else {
            # `zip`, not Compress-Archive: it keeps the executable bit, and a
            # service that arrives without it cannot start.
            Push-Location installer/stage
            zip -r -q "../$name.zip" $name
            Pop-Location
          }
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Verify the host runs
        shell: pwsh
        run: |
          $exe = "installer/build/${{ matrix.exe }}"
          $reported = & $exe --version
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          if ($reported.Trim() -ne $expected) {
            throw "Le binaire annonce $reported, attendu $expected"
          }
          # Proves pdf.js and its assets survived the bundling, which is the
          # part that broke first when this was built.
          & $exe ticket fixtures/booksy/recu-1167.anon.pdf | Select-Object -First 3

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          generate_release_notes: true
